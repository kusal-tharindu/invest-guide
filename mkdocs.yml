site_name: ETF Guide LK
site_description: A beginner's step-by-step guide to ETF investing, written in public from Sri Lanka.
site_url: https://kusal-tharindu.github.io/invest-guide/
site_author: Kusal Tharindu

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/chart-line
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

copyright: "&copy; 2026 ETF Guide LK. All rights reserved."

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Basics:
      - basics/index.md
  - Comparisons:
      - comparisons/index.md
      - ETF vs Index: comparisons/etf-vs-index.md
  - ETF Types:
      - etf-types/index.md
  - By Location & Tax:
      - by-location/index.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
